# Root-level blueprint: Render's default Blueprint Path looks here.
# The service definition lives with its Dockerfile in backend/.
# NOTE: dockerfilePath/dockerContext are relative to THIS file's directory.
services:
  - type: web
    name: preventvital-ocr
    runtime: docker
    plan: free
    region: singapore
    # Context must be the REPO ROOT so Docker can COPY ../schema into the
    # image (extract.js reads ../schema/Lab_Test_Schema.json at runtime).
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeploy: false
    envVars:
      - key: EXTRACT_MAX_FILES
        value: "5"
      - key: OCR_TIMEOUT_MS
        value: "60000"
